apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: java-jfr-with-sidecar
  labels:
    app: java-jfr-with-sidecar
spec:
  serviceName: java-jfr-with-sidecar
  replicas: 1
  selector:
    matchLabels:
      app: java-jfr-with-sidecar
  template:
    metadata:
      labels:
        app: java-jfr-with-sidecar
    spec:
      shareProcessNamespace: true
      terminationGracePeriodSeconds: 60
      securityContext:
        seccompProfile:
          type: RuntimeDefault
        runAsUser: 111111
        runAsGroup: 0
      initContainers:
        - command:
            - sh
            - -c
            - chown -R 111111:0 /tmp/jfr
          securityContext:
            runAsUser: 0
          volumeMounts:
            - mountPath: /tmp/jfr
              name: profile-storage
              readOnly: false
          image: busybox:latest
          name: configure-offsetmarkers-directory
      containers:
        - name: java-app
          image: profiler-app:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 8080
              name: http
          lifecycle:
            preStop:
              exec:
                command:
                  - sh
                  - -c
                  - sleep 20
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: JAVA_OPTS
               # modify the value below to change JFR settings to experiment with
#              value: "-XX:StartFlightRecording=duration=1h,filename=/tmp/jfr/recording.jfr" ,maxchunksize=1M,memorysize=1M,repository=/tmp
              #value: "-Xlog:gc:/opt/opendj/data/gc.log:time,uptime:filecount=5,filesize=50M"
              value: "-Xlog:jfr+startup=off,gc:/opt/gc/gc.log:time,uptime:filecount=5,filesize=50M -XX:NativeMemoryTracking=summary -XX:FlightRecorderOptions=stackdepth=128 -XX:StartFlightRecording:name=main-recording,duration=1m,maxage=1m,maxsize=2M,jdk.GCPhaseParallel#enabled=false,jdk.SocketRead#enabled=false,jdk.ThreadPark#enabled=false,dumponexit=true,filename=/tmp/jfr/main-recording-%t-%p.jfr"
          command: ["sh", "-c", "java $JAVA_OPTS -jar /opt/app/app.jar"]
          volumeMounts:
            - name: profile-storage
              mountPath: /tmp/jfr
              subPathExpr: $(POD_NAME)
            - name: gc-logs
              mountPath: /opt/gc
              readOnly: false
        - name: go-sidecar
          image: profiler-sidecar:latest
          imagePullPolicy: Never
          command: ["/app/profiler-sidecar", "sidecar"]
          ports:
            - containerPort: 8081
              name: api
          volumeMounts:
            - name: profile-storage
              mountPath: /tmp/jfr
              subPathExpr: $(POD_NAME)
            - name: gc-logs
              mountPath: /opt/gc
              readOnly: true
          env:
            - name: POD_NAME
              valueFrom:
                fieldRef:
                  fieldPath: metadata.name
            - name: LOG_LEVEL
              value: "debug"
      volumes:
        - name: profile-storage
          hostPath:
            path: /tmp/jfr
            type: DirectoryOrCreate
        - name: gc-logs
          emptyDir:
            sizeLimit: 500Mi
